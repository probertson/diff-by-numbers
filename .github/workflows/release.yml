# Release pipeline. Pushing a semver tag (vX.Y.Z) cross-compiles the four Unix
# targets with GoReleaser and publishes the archives + checksums.txt to a GitHub
# Release, which install.sh then downloads. Uses the built-in GITHUB_TOKEN — no
# extra secret.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
