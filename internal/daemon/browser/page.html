{{define "page" -}}

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body data-stop-url="{{.StopURL}}" data-events-url="{{.EventsURL}}" data-diagrams-url="{{.DiagramsURL}}">

</html>
