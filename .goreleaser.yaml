# GoReleaser config for dbn's release pipeline. Cross-compiles the four Unix
# targets, stamps the version from the git tag, and publishes the archives plus a
# stable checksums.txt to a GitHub Release — the assets that install.sh
# downloads. Validated in CI by `goreleaser check` (see
# .github/workflows/release-check.yml); the archive and checksum name templates
# below are one half of a contract with install.sh's asset-name construction.
version: 2

project_name: dbn

builds:
  - id: dbn
    main: ./cmd/dbn
    binary: dbn
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: dbn
    ids:
      - dbn
    # Version-free name so install.sh can build a stable URL for both the
    # releases/latest/download redirect and a pinned releases/download/<tag>.
    name_template: "dbn_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  # Stable name (GoReleaser's default embeds the version) so the checksums file
  # is reachable at releases/latest/download/checksums.txt.
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: probertson
    name: diff-by-numbers

changelog:
  use: github
